name: Daily Doc Maintenance

on:
  schedule:
    - cron: '0 9 * * *'  # 9:00 AM UTC daily
  workflow_dispatch:       # Manual trigger from Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  update-docs:
    name: Update docs with doc-maintenance skill
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync release-updates branch
        run: |
          BRANCH="release-updates"
          # This long-running branch is expected to exist on origin.
          git fetch origin
          git checkout -B "${BRANCH}" "origin/${BRANCH}"
          echo "BRANCH=${BRANCH}" >> "$GITHUB_ENV"

      - name: Setup GitHub Copilot CLI
        uses: mvkaran/setup-copilot-cli@v1
        with:
          version: latest
          token: ${{ secrets.COPILOT_TOKEN }}

      - name: Load skills
        run: |
          mkdir -p ~/.copilot/skills
          cp -r .github/skills/doc-maintenance ~/.copilot/skills/
          cp -r .github/skills/get-release-url ~/.copilot/skills/
          cp -r .github/skills/git-commit ~/.copilot/skills/

      - name: Configure Copilot CLI for CI
        run: |
          mkdir -p ~/.copilot
          echo '{"askUser": false}' > ~/.copilot/settings.json

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run doc-maintenance workflow
        env:
          COPILOT_ALLOW_ALL: 'true'
        run: |
          copilot -i "You are running in a non-interactive CI environment. \
          Use the doc-maintenance skill to check whether a new GitHub Copilot CLI \
          version has been released since the last documented version in this repo. \
          If a new version exists, follow the skill instructions to update all \
          relevant markdown files in this repository: bump the version note in \
          README.md, add a new section to 16-new-features.md, update \
          00-cheat-sheet.md, and update any feature-specific files as described \
          in the skill's doc file map. Update CHANGELOG-history.md with a new \
          entry. Do not ask for confirmation — make all changes directly to the \
          files. Do not explain what you are doing — just do it."

      - name: Check for documentation changes
        id: changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No documentation changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Documentation changes detected:"
            git --no-pager diff --stat
          fi

      - name: Commit changes on release-updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add -A
          git commit -m "docs: update Copilot CLI guide

          Automated update generated by the doc-maintenance workflow.

          Trigger: ${{ github.event_name }}
          Branch: ${BRANCH}"

      - name: Push release-updates branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push origin "${BRANCH}"

      - name: Create or reuse pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list \
            --base main \
            --head "${BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "${EXISTING}" ]; then
            echo "Open PR #${EXISTING} already exists for ${BRANCH} -> main."
            exit 0
          fi

          CHANGED_FILES=$(git --no-pager diff --name-only origin/main.."${BRANCH}" | sed 's/^/- `/' | sed 's/$/`/')

          cat > /tmp/doc-maintenance-pr-body.md <<EOF
          ## Automated Documentation Update

          This pull request tracks automated documentation updates on \`${BRANCH}\`.

          ### Changed files
          ${CHANGED_FILES}

          ### Automation details
          - Trigger: \`${{ github.event_name }}\`
          - Source branch: \`${BRANCH}\`
          - Target branch: \`main\`
          - Workflow: \`doc-maintenance\`

          > This PR is kept open and updated automatically as new commits are pushed to \`${BRANCH}\`.
          EOF

          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "docs: update Copilot CLI guide" \
            --body-file /tmp/doc-maintenance-pr-body.md
