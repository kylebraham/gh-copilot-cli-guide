name: Daily Doc Maintenance

on:
  schedule:
    - cron: "0 9 * * *" # 9:00 AM UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-docs:
    name: Update docs on release-updates
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync release-updates branch
        run: |
          BRANCH="release-updates"
          if ! git fetch origin "${BRANCH}"; then
            echo "::error::origin/${BRANCH} must exist before this workflow runs."
            exit 1
          fi
          git checkout -B "${BRANCH}" "origin/${BRANCH}"
          echo "BRANCH=${BRANCH}" >> "$GITHUB_ENV"

      - name: Setup GitHub Copilot CLI
        uses: mvkaran/setup-copilot-cli@v1
        with:
          version: latest
          token: ${{ secrets.COPILOT_TOKEN }}

      - name: Load doc-maintenance skill
        run: |
          mkdir -p ~/.copilot/skills
          cp -r .github/skills/doc-maintenance ~/.copilot/skills/

      - name: Configure Copilot CLI for CI
        run: |
          mkdir -p ~/.copilot
          echo '{"askUser": false}' > ~/.copilot/settings.json

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run doc-maintenance skill
        env:
          COPILOT_ALLOW_ALL: 'true'
        run: |
          copilot -i "$(cat <<'EOF'
          You are running in a non-interactive CI environment on the
          release-updates branch.

          Use only the doc-maintenance skill to determine whether this docs
          repository needs updates for the latest github/copilot-cli release.

          If updates are needed, apply them directly to the current working tree
          on release-updates.

          Do not commit, do not push, do not switch branches, do not create a
          pull request, and do not edit .github/last-processed-release.

          If no updates are needed, leave the working tree unchanged.
          EOF
          )"

      - name: Check for documentation changes
        id: changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No documentation changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Documentation changes detected:"
            git --no-pager diff --stat
          fi

      - name: Get latest github/copilot-cli release
        if: steps.changes.outputs.changed == 'true'
        id: release
        run: |
          LATEST=$(curl -fsSL \
            https://api.github.com/repos/github/copilot-cli/releases/latest \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            | jq -r '.tag_name')

          if [ -z "${LATEST}" ] || [ "${LATEST}" = "null" ]; then
            echo "::error::Could not determine the latest Copilot CLI release."
            exit 1
          fi

          echo "tag=${LATEST}" >> "$GITHUB_OUTPUT"

      - name: Update release marker
        if: steps.changes.outputs.changed == 'true'
        run: |
          printf '%s\n' "${{ steps.release.outputs.tag }}" \
            > .github/last-processed-release

      - name: Load commit skills
        if: steps.changes.outputs.changed == 'true'
        run: |
          cp -r .github/skills/get-release-url ~/.copilot/skills/
          cp -r .github/skills/git-commit ~/.copilot/skills/

      - name: Commit and push with git-commit skill
        if: steps.changes.outputs.changed == 'true'
        env:
          COPILOT_ALLOW_ALL: 'true'
        run: |
          copilot -i "$(cat <<EOF
          You are running in a non-interactive CI environment on the
          release-updates branch.

          Use the git-commit skill to stage, commit, and push all current
          repository changes on release-updates.

          Use the get-release-url skill if needed so the commit body links to
          the canonical release URL for ${{ steps.release.outputs.tag }}.

          Do not create or switch branches.
          Do not open a pull request.
          EOF
          )"

      - name: Check for existing release-updates pull request
        if: steps.changes.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list \
            --base main \
            --head "${BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "${EXISTING}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "number=${EXISTING}" >> "$GITHUB_OUTPUT"
            echo "Open PR #${EXISTING} already exists for ${BRANCH} -> main."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No open PR exists for ${BRANCH} -> main."
          fi

      - name: Create release-updates pull request
        if: >
          steps.changes.outputs.changed == 'true' &&
          steps.pr.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main
          git fetch origin "${BRANCH}"
          CHANGED_FILES=$(git --no-pager diff --name-only \
            "origin/main...origin/${BRANCH}" \
            | sed 's/^/- `/' \
            | sed 's/$/`/')

          if [ -z "${CHANGED_FILES}" ]; then
            CHANGED_FILES="- \`No file list available\`"
          fi

          cat > /tmp/doc-maintenance-pr-body.md <<EOF
          ## Automated Documentation Update

          This pull request tracks automated documentation updates on
          \`${BRANCH}\`.

          ### Changed files
          ${CHANGED_FILES}

          ### Automation details
          - Trigger: \`${{ github.event_name }}\`
          - Release: \`${{ steps.release.outputs.tag }}\`
          - Source branch: \`${BRANCH}\`
          - Target branch: \`main\`
          - Workflow: \`doc-maintenance\`

          > This PR is kept open and updated automatically as new commits are
          > pushed to \`${BRANCH}\`.
          EOF

          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "docs: update Copilot CLI guide" \
            --body-file /tmp/doc-maintenance-pr-body.md
