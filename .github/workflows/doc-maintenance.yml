name: Daily Doc Maintenance

on:
  schedule:
    - cron: '0 9 * * *'  # 9:00 AM UTC daily
  workflow_dispatch:       # Manual trigger from Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  update-docs:
    name: Update docs with doc-maintenance skill
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GitHub Copilot CLI
        uses: mvkaran/setup-copilot-cli@v1
        with:
          version: latest
          token: ${{ secrets.COPILOT_TOKEN }}

      - name: Load doc-maintenance skill
        run: |
          mkdir -p ~/.copilot/skills
          cp -r .github/skills/doc-maintenance ~/.copilot/skills/

      - name: Run doc-maintenance workflow
        run: |
          copilot -i "You are running in a non-interactive CI environment. \
          Use the doc-maintenance skill to check whether a new GitHub Copilot CLI \
          version has been released since the last documented version in this repo. \
          If a new version exists, follow the skill instructions to update all \
          relevant markdown files in this repository: bump the version note in \
          README.md, add a new section to 16-new-features.md, update \
          00-cheat-sheet.md, and update any feature-specific files as described \
          in the skill's doc file map. Update CHANGELOG-history.md with a new \
          entry. Do not ask for confirmation — make all changes directly to the \
          files. Do not explain what you are doing — just do it."

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No documentation changes detected — docs are already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Documentation changes detected."
            git --no-pager diff --stat
          fi

      - name: Create branch, commit, and open PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="docs/auto-update-${DATE}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add -A
          git commit -m "docs: auto-update documentation via doc-maintenance skill

          Automated daily documentation update.
          Changes detected and applied by the doc-maintenance skill."

          git push origin "$BRANCH"

          gh pr create \
            --title "docs: auto-update for $(date +%Y-%m-%d)" \
            --body "## Automated Documentation Update

          This PR was automatically generated by the daily doc-maintenance workflow.

          The \`doc-maintenance\` skill detected that the documentation was out of date
          and updated the relevant markdown files.

          ### What to review
          - Version bump in \`README.md\`
          - New version section in \`16-new-features.md\`
          - \`00-cheat-sheet.md\` for any new commands or shortcuts
          - \`CHANGELOG-history.md\` for the new entry
          - Any feature-specific files updated per the doc file map

          > Triggered by: \`${{ github.event_name }}\`" \
            --base main \
            --head "$BRANCH"
